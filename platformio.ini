; ESP32-S3 Server Pinger
; Build/upload with PlatformIO (VS Code extension, or `pio` on the CLI).
; Arduino IDE and arduino-cli are no longer used.

[platformio]
default_envs = usb

; ---- settings shared by every environment -------------------------------
[env]
platform  = espressif32          ; pins Arduino core 2.0.17 (see README)
board     = esp32-s3-devkitc-1
framework = arduino

; The board has 8MB of flash. Without these it is treated as 4MB, which
; halves the OTA slots to 1.25MB each.
board_upload.flash_size = 8MB
board_build.flash_mode  = qio
board_build.partitions  = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; CORE_DEBUG_LEVEL=1 (ERROR) keeps ArduinoOTA's own failure messages, which
; are the difference between diagnosing an OTA problem and guessing at it.
build_flags = -DCORE_DEBUG_LEVEL=1

; HomeSpan is pinned to 1.9.1 on purpose: it is the last release that builds on
; Arduino core 2.x (the 2.0.17 this platform ships). 2.0.0 and later need core
; 3.x. Do not bump it without moving the platform to pioarduino (see README).
lib_deps =
  https://github.com/marian-craciunescu/ESP32Ping.git
  https://github.com/HomeSpan/HomeSpan.git#1.9.1

; ---- flashing over USB --------------------------------------------------
[env:usb]
upload_speed = 921600

; ---- flashing over WiFi -------------------------------------------------
; `pio run -e ota -t upload`
; On macOS this can be silently blocked by the Application Firewall; see the
; OTA section of README.md and use ./ota.sh if it hangs at 0%.
[env:ota]
upload_protocol = espota
upload_port     = 192.168.1.220
